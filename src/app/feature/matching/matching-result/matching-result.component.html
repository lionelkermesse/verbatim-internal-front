<div *ngIf="matchingResult">
  <h2>Matching Result for session {{ matchingResult.sessionIdentifier }} - Version {{ matchingResult.version }}</h2>

  <div class="actions">
    <button nz-button nzType="primary" [routerLink]="['/home']">Back to Matching</button>
    <button nz-button nzType="primary" (click)="validate()" [disabled]="hasUnmatchedItems()">Validate</button>
  </div>

  <nz-table #resultTable [nzData]="matchingResult.matchingResult.result" nzBordered nzSimple [nzFrontPagination]="false">
    <thead>
      <tr>
        <th nzWidth="40%">Verbatim</th>
        <th>Event</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <ng-template ngFor let-data [ngForOf]="resultTable.data">
        <tr [ngClass]="getNzTableRowClass(data)">
          <td [nzIndentSize]="data.level * 20" [nzShowExpand]="data.inners.length > 0" [(nzExpand)]="data.expand">
            {{ data.verbatim }}
          </td>
          <td>{{ data.title }}</td>
          <td>{{ data.status }}</td>
          <td>
            <div *ngIf="isUnmatched(data)">
              <nz-select nzShowSearch nzAllowClear nzPlaceHolder="Select a speaker" [(ngModel)]="selectedSpeaker">
                <nz-option *ngFor="let speaker of matchingResult.matchingResult.speakers" [nzLabel]="speaker.fullName" [nzValue]="speaker"></nz-option>
              </nz-select>
              <button nz-button nzType="primary" [disabled]="!selectedSpeaker" (click)="updateMatch(data)">Update</button>
            </div>
          </td>
        </tr>
        <tr [nzExpand]="data.expand">
          <td colspan="4">
            <app-matching-result-inner [items]="data.inners" [speakers]="matchingResult.matchingResult.speakers" [sessionIdentifier]="matchingResult.sessionIdentifier" [version]="matchingResult.version"></app-matching-result-inner>
          </td>
        </tr>
      </ng-template>
    </tbody>
  </nz-table>
</div>
