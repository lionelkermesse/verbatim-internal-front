<header class="navbar-container">
  <div class="navbar-logo">
    <img ngSrc="/chd-logo.svg" alt="Chambre des Députés Logo" class="logo" width="203" height="32" priority>
  </div>

  <!-- Navigation Links -->
  <nav class="navbar-nav" *ngIf="!isLoginRoute()">
    <a [routerLink]="['/sessions']" class="nav-link" [class.active]="isSessionsActive()">
      <span nz-icon nzType="table" nzTheme="outline"></span>
      {{ 'nav.sessions' | translate }}
    </a>
    <a [routerLink]="['/referential']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" class="nav-link">
      <span nz-icon nzType="setting" nzTheme="outline"></span>
      {{ 'nav.referential' | translate }}
    </a>
  </nav>

  <div class="navbar-actions">
    <nz-select
      [(ngModel)]="selectedLanguage"
      (ngModelChange)="onLanguageChange($event)"
      class="language-selector"
      nzBorderless
      [nzCustomTemplate]="selectedTemplate"
    >
      <nz-option nzValue="fr" nzLabel="Français"></nz-option>
      <nz-option nzValue="de" nzLabel="Deutsch"></nz-option>
      <nz-option nzValue="en" nzLabel="English"></nz-option>
      <nz-option nzValue="lu" nzLabel="Lëtzebuergesch"></nz-option>
    </nz-select>

    <!-- Custom selected display showing only ISO2 code -->
    <ng-template #selectedTemplate>
      <span class="selected-language">{{ getLanguageCode(selectedLanguage) }}</span>
    </ng-template>
  </div>
</header>
