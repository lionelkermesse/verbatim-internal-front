<header class="navbar-container">
  <div class="navbar-logo">
    <img ngSrc="/chd-logo.svg" alt="Chambre des Députés Logo" class="logo" width="203" height="32">
  </div>
  <div class="navbar-actions">
    <nz-select [(ngModel)]="selectedLanguage" (ngModelChange)="onLanguageChange($event)" class="language-selector" nzBorderless>
      <nz-option nzValue="fr" nzLabel="FR"></nz-option>
      <nz-option nzValue="de" nzLabel="DE"></nz-option>
      <nz-option nzValue="en" nzLabel="EN"></nz-option>
      <nz-option nzValue="lu" nzLabel="LU"></nz-option>
    </nz-select>
  </div>
</header>
